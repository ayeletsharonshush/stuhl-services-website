<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Stuhl Services LLC is a local, owner-operated remodeling company serving Morris and Union Counties in New Jersey. Premium bathrooms, basements, and kitchens." />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.stuhlservices.com/" />
    <meta property="og:title" content="Stuhl Services LLC | Premium Remodeling" />
    <meta property="og:description" content="From custom kitchens to premium bathroom retreats, we bring high-end craftsmanship and local reliability to every square inch of your home." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Stuhl Services LLC | Premium Remodeling" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                navy: '#0F2557',
                red: '#DC2626',
                gold: '#B8860B',
                cyan: '#0891B2',
                cream: '#FAF8F5',
                charcoal: '#1A1A2E',
              }
            },
            animation: {
              'fade-up': 'fadeUp 0.8s ease-out forwards',
              'fade-in': 'fadeIn 0.6s ease-out forwards',
              'slide-right': 'slideRight 0.8s ease-out forwards',
              'counter': 'counter 2s ease-out forwards',
              'float': 'float 6s ease-in-out infinite',
            },
            keyframes: {
              fadeUp: {
                '0%': { opacity: '0', transform: 'translateY(30px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideRight: {
                '0%': { opacity: '0', transform: 'translateX(-30px)' },
                '100%': { opacity: '1', transform: 'translateX(0)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0px)' },
                '50%': { transform: 'translateY(-10px)' },
              },
            },
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/logo-animations.css">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      h1, h2, h3 {
        font-family: 'DM Serif Display', serif;
      }
      ::selection {
        background-color: #0891B2;
        color: white;
      }
      .scroll-smooth {
        scroll-behavior: smooth;
      }
      .text-gradient {
        background: linear-gradient(135deg, #B8860B, #D4A017);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .glass {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }
      .line-clamp-2 {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
    </style>
  </head>
  <body class="bg-brand-cream text-brand-charcoal overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
